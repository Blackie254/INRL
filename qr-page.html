<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK-MD QR</title>
  <style>
    body {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; margin: 0;
      background-size: cover; animation: changeBackground 15s infinite;
      font-family: Arial, sans-serif;
    }
    @keyframes changeBackground {
      10%, 100% { background-image: url('https://files.catbox.moe/li9riq.jpg'); }
      25%        { background-image: url('https://files.catbox.moe/84bdiz.jpg'); }
      50%        { background-image: url('https://files.catbox.moe/zwmfbf.jpg'); }
      75%        { background-image: url('https://files.catbox.moe/af1sso.jpg'); }
    }
    .box {
      background: #0057FF; border-radius: 10px; padding: 24px;
      text-align: center; max-width: 320px; width: 90%;
    }
    h3 { color: #000; margin-bottom: 8px; }
    p  { color: #000; font-size: 13px; margin-bottom: 16px; }
    .qr-wrap {
      background: white; border-radius: 8px; padding: 10px;
      display: inline-block; margin-bottom: 14px;
    }
    .qr-wrap img { width: 220px; height: 220px; display: block; }
    .status { color: #000; font-size: 13px; font-weight: bold; }
    .btn {
      margin-top: 16px; padding: 10px 24px; background: #25D366;
      border: none; border-radius: 8px; color: #000; font-weight: bold;
      font-size: 14px; cursor: pointer;
    }
    .btn:hover { background: #1db954; }
  </style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style id="fx-style">
:root{--c1:#00c8ff;--c2:#2f6bff;--c3:#ff1e4d;--c3d:#b8002b;--ink:#e6f5ff;--mut:#7f9fc4;--bg:#02040d;--disp:'Orbitron','Segoe UI',system-ui,sans-serif;--body:'Rajdhani','Segoe UI',system-ui,sans-serif;--mono:'Share Tech Mono',ui-monospace,Consolas,monospace}
@property --fa{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes fxspin{to{--fa:360deg}}
@keyframes fxscan{from{top:-4%}to{top:104%}}
@keyframes fxblink{50%{opacity:0}}
@keyframes fxfloat{50%{translate:0 -7px}}
@keyframes fxin{from{opacity:0;scale:.93;filter:blur(6px)}}
@keyframes fxpulse{50%{box-shadow:0 0 22px rgba(0,200,255,.28),0 0 44px rgba(255,30,77,.16),inset 0 0 20px rgba(0,200,255,.08)}}
::selection{background:var(--c3);color:#fff}
html{scrollbar-color:var(--c1) var(--bg)}
body{font-family:var(--body);font-weight:500;color:var(--ink);animation:none!important;background:var(--bg)!important}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block;pointer-events:none;transition:opacity .9s ease}
#fx-veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,200,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 100% 100%,rgba(255,30,77,.16),transparent 46%),radial-gradient(ellipse at 0% 0%,rgba(47,107,255,.16),transparent 46%),radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(1,2,8,.8) 100%)}
/* containers: holo panels */
.box{position:relative;overflow:hidden;isolation:isolate;border:4px solid transparent;border-radius:6px!important;
background-color:transparent!important;
background-image:linear-gradient(rgba(0,200,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.05) 1px,transparent 1px),linear-gradient(160deg,rgba(4,12,30,.97),rgba(2,5,15,.94)),conic-gradient(from var(--fa),rgba(0,200,255,.26) 0 48%,var(--c1) 66%,var(--c3) 84%,var(--c1) 94%,rgba(0,200,255,.26))!important;
background-size:22px 22px,22px 22px,auto,auto!important;background-origin:padding-box,padding-box,padding-box,border-box!important;background-clip:padding-box,padding-box,padding-box,border-box!important;
-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 70px rgba(0,200,255,.38),0 0 130px rgba(255,30,77,.2),0 34px 90px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,200,255,.3),inset 0 0 70px rgba(47,107,255,.16);
animation:fxin 1s ease both,fxfloat 8s ease-in-out 1s infinite,fxspin 7s linear infinite}
.box::before{content:"";position:absolute;inset:11px;pointer-events:none;background:linear-gradient(var(--c1),var(--c1)) 0 0/28px 3px,linear-gradient(var(--c1),var(--c1)) 0 0/3px 28px,linear-gradient(var(--c3),var(--c3)) 100% 0/28px 3px,linear-gradient(var(--c3),var(--c3)) 100% 0/3px 28px,linear-gradient(var(--c3),var(--c3)) 0 100%/28px 3px,linear-gradient(var(--c3),var(--c3)) 0 100%/3px 28px,linear-gradient(var(--c1),var(--c1)) 100% 100%/28px 3px,linear-gradient(var(--c1),var(--c1)) 100% 100%/3px 28px;background-repeat:no-repeat;filter:drop-shadow(0 0 5px var(--c1))}
.box::after{content:"";position:absolute;left:0;right:0;top:-4%;height:2px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,200,255,.75),rgba(255,30,77,.6),transparent);box-shadow:0 0 16px rgba(0,200,255,.7);animation:fxscan 5s linear infinite}
#text,.box p,.status{color:var(--ink)!important}
.box p{font-size:15px}
.box h3{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--c1)!important;text-shadow:0 0 14px rgba(0,200,255,.8),0 0 30px rgba(47,107,255,.5);padding-bottom:12px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--c1),rgba(0,200,255,.15) 60%,var(--c3)) 1}
.box h3::before{content:"> ";color:var(--c3);text-shadow:0 0 12px rgba(255,30,77,.9)}
.box h3::after{content:"_";color:var(--c3);animation:fxblink 1s steps(1) infinite}
.box h4{font-family:var(--body);color:var(--mut)!important;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.fa-user{font-size:30px;color:var(--c1);filter:drop-shadow(0 0 8px var(--c1))}
.status{font-family:var(--mono);font-size:13px!important;letter-spacing:.04em}
.qr-wrap{color:#02040d;border-radius:3px!important;outline:1px solid rgba(255,30,77,.7);outline-offset:6px;box-shadow:0 0 0 1px var(--c1),0 0 34px rgba(0,200,255,.6),0 0 60px rgba(255,30,77,.2)}
.box .btn{font-family:var(--disp);font-weight:700;font-size:12px;background:transparent!important;color:var(--c1)!important;border:1px solid var(--c1)!important;border-bottom:2px solid var(--c3)!important;border-radius:3px!important;text-transform:uppercase;letter-spacing:.16em;transition:.25s}
.box .btn:hover{background:var(--c1)!important;color:var(--bg)!important;border-bottom-color:var(--c3)!important;box-shadow:0 0 26px rgba(0,200,255,.7),0 6px 22px rgba(255,30,77,.4)}
/* pair form */
.input-container{background:rgba(0,200,255,.07)!important;border:1px solid rgba(0,200,255,.38);border-radius:4px!important;box-shadow:none}
.input-container input{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:rgba(1,5,16,.9)!important;color:var(--c1)!important;border-left:3px solid var(--c3)!important;border-radius:3px!important}
.input-container input::placeholder{color:#4a6a92}
.input-container input:focus{box-shadow:0 0 0 1px var(--c1),0 0 22px rgba(0,200,255,.55)}
.input-container button{font-family:var(--disp);font-weight:900;font-size:11px;letter-spacing:.12rem;padding:1rem .4rem;background:linear-gradient(135deg,var(--c3),var(--c3d))!important;color:#fff!important;border-radius:3px!important;box-shadow:0 0 16px rgba(255,30,77,.45);cursor:pointer}
.input-container button:hover{background:var(--c1)!important;color:var(--bg)!important;box-shadow:0 0 22px rgba(0,200,255,.7)}
.music-button{font-family:var(--disp);font-weight:700;font-size:12px!important;letter-spacing:.14em;text-transform:uppercase;background:transparent!important;border:1px solid var(--c3)!important;color:var(--c3)!important;border-radius:3px!important;transition:.25s}
.music-button:hover{background:rgba(255,30,77,.16)!important;box-shadow:0 0 22px rgba(255,30,77,.6)}
.countdown{font-family:var(--mono);color:var(--mut)!important}.countdown.urgent{color:var(--c3)!important;text-shadow:0 0 10px rgba(255,30,77,.7);animation:fxblink 1s steps(1) infinite}
#waiting-message{color:var(--mut);font-family:var(--mono)}
#pair [style*="black"]{color:var(--ink)!important}
#pair [style*="red"]{color:var(--c3)!important;text-shadow:0 0 12px rgba(255,30,77,.55)}
#pair [style*="blue"]{color:var(--c1)!important}
#pair [style*="#555"],#pair [style*="#000"]{color:var(--mut)!important}
#pair a,#pair small{font-family:var(--body);letter-spacing:.04em}
#pair #copy span[style]{font-family:var(--mono);font-size:26px;letter-spacing:.3em;color:var(--c1)!important;text-shadow:0 0 16px var(--c1),0 0 34px rgba(47,107,255,.6)}
/* home buttons */
body>.btn{width:290px!important;font-family:var(--disp)!important;font-weight:700!important;font-size:13px!important;text-transform:uppercase;letter-spacing:.16em;background:rgba(3,10,26,.74)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(0,200,255,.5)!important;border-left:4px solid var(--c3)!important;border-radius:3px!important;color:var(--c1)!important;text-shadow:0 0 10px rgba(0,200,255,.55);box-shadow:0 0 20px rgba(0,200,255,.18),inset 0 0 20px rgba(0,200,255,.07);animation:fxin .9s ease both,fxfloat 7s ease-in-out 1s infinite}
body>.btn:nth-of-type(2){animation-delay:.15s,-2s}body>.btn:nth-of-type(3){animation-delay:.3s,-4s}
body>.btn::before{background:var(--c3)!important}
body>.btn::after{background:var(--c1)!important}
body>.btn:hover{color:var(--bg)!important;text-shadow:none;box-shadow:0 0 34px rgba(0,200,255,.6),0 0 60px rgba(255,30,77,.3)}
.home-tag{margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);text-align:center}
.home-tag i{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--c3);box-shadow:0 0 10px var(--c3);animation:fxblink 1.4s steps(1) infinite;vertical-align:middle}
button:focus-visible,input:focus-visible{outline:2px solid var(--c3);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.box,.box::after,.box h3::after,.countdown.urgent,body>.btn,.home-tag i{animation:none!important}}
.bm-logo{display:block;width:112px;height:auto;margin:0 auto 8px;filter:drop-shadow(0 0 12px rgba(0,200,255,.6)) drop-shadow(0 0 22px rgba(255,30,77,.25))}
/* responsive: fluid sizing so the panel never fills the screen */
html{-webkit-text-size-adjust:100%}
body{box-sizing:border-box;height:auto!important;min-height:100vh;min-height:100dvh;overflow-x:hidden!important;overflow-y:auto!important;padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.box{box-sizing:border-box;width:min(88vw,380px)!important;max-width:none!important;padding:clamp(16px,5vw,26px)!important}
.box h3{font-size:clamp(13px,4.8vw,19px);letter-spacing:clamp(.1em,1.8vw,.22em)}
.box h4{font-size:clamp(10px,3.2vw,13px);letter-spacing:clamp(.08em,1.2vw,.2em)}
.box p{font-size:clamp(12px,3.6vw,15px)}
.bm-logo{width:clamp(84px,26vw,112px)}
.qr-wrap img{width:min(220px,56vw)!important;height:auto!important;aspect-ratio:1/1}
.input-container{max-width:100%!important;margin-inline:auto}
#pair #copy span[style]{font-size:clamp(17px,6.2vw,26px);letter-spacing:clamp(.1em,1.6vw,.3em)}
.music-button{font-size:clamp(11px,3.2vw,12px)!important}
body>.btn{width:min(82vw,300px)!important;font-size:clamp(11px,3.4vw,13px)!important;letter-spacing:clamp(.08em,1.6vw,.16em);padding:.9em 1em!important;margin-bottom:clamp(14px,3vh,24px)}
.home-tag{font-size:clamp(10px,3vw,12px);letter-spacing:clamp(.1em,1.4vw,.2em)}
@media(max-width:340px){.box::before{inset:7px}.box .btn{letter-spacing:.08em}}
@media(max-height:560px){.bm-logo{width:68px;margin-bottom:2px}.box{padding:14px!important}.box h3{padding-bottom:8px}.box h4{margin:6px 0}}
</style>
</head>
<body>
  <div class="box">
    <h3>BLACK-MD QR LOGIN</h3>
    <p>Scan with WhatsApp → Linked Devices → Link a Device<br>
       Your session key will be sent to your WhatsApp DM.</p>
    <div class="qr-wrap">
      <img id="qrImg" src="" alt="Loading QR..." />
    </div>
    <div class="status" id="status">⏳ Loading QR code...</div>
    <br>
    <button class="btn" onclick="loadQR()">🔄 Refresh QR</button>
  </div>
  <script>
    function loadQR() {
      const img = document.getElementById('qrImg');
      const status = document.getElementById('status');
      status.textContent = '⏳ Loading QR code...';
      img.src = '/qr?' + Date.now();
      img.onload = () => { status.textContent = '📷 Scan now! Session key will arrive in your WhatsApp DM.'; };
      img.onerror = () => { status.textContent = '❌ Failed to load QR. Click Refresh to try again.'; };
    }
    loadQR();
  </script>
<div id="fx-veil"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
(function(){
var cv=document.getElementById('fx'),g=cv.getContext('2d'),R=['rain','net','warp'],K='inrl-bg-i',idx=0,mode='rain';
var DP=1,W=0,H=0,t=0,raf=0,mx=0,my=0,tx=0,ty=0,PX=-9999,PY=-9999,N=[],Z=[],RC=[],RS=[],RL=[];
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var CH="01\uff71\uff72\uff73\uff74\uff75\uff76\uff77\uff78\uff79\uff7a\uff7b\uff7c\uff7d\uff7e\uff7f<>/{}[]#$%=+";
function rnd(a,b){return a+Math.random()*(b-a)}
function init(){var i,n=Math.max(40,Math.min(110,Math.round(W*H/16000)));N=[];for(i=0;i<n;i++)N.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-.25,.25),vy:rnd(-.25,.25)});Z=[];for(i=0;i<260;i++)Z.push({x:rnd(-1,1),y:rnd(-1,1),z:Math.random()});RC=[]}
function size(){var d=DP=Math.min(window.devicePixelRatio||1,1.5);W=cv.width=Math.round(innerWidth*d);H=cv.height=Math.round(innerHeight*d);init();if(rm)still()}
function rain(){var fs=Math.max(Math.round(15*DP),Math.round(W/90)),c=Math.ceil(W/fs),i,row,hd;
if(RC.length!=c){RC=[];RS=[];RL=[];for(i=0;i<c;i++){RC.push(rnd(-H/fs,0));RS.push(rnd(.25,.7));RL.push(-9999)}}
g.globalCompositeOperation='source-over';g.fillStyle='rgba(2,4,13,.14)';g.fillRect(0,0,W,H);g.font=fs+'px "Share Tech Mono",monospace';
for(i=0;i<c;i++){RC[i]+=RS[i];row=Math.floor(RC[i]);if(row==RL[i])continue;RL[i]=row;hd=Math.random()<.06;
if(hd){g.shadowColor='#00c8ff';g.shadowBlur=10;g.fillStyle='#e6f5ff'}else{g.shadowBlur=0;g.fillStyle=i%7?'#00c8ff':'#ff1e4d'}
g.fillText(CH.charAt(Math.floor(Math.random()*CH.length)),i*fs,row*fs);
if(row*fs>H&&Math.random()>.975){RC[i]=0;RS[i]=rnd(.25,.7)}}
g.shadowBlur=0}
function net(){var gr=g.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7),D=Math.min(W,H)*.16,i,j,a,b,dx,dy,d,h;g.globalCompositeOperation='source-over';gr.addColorStop(0,'#071a3a');gr.addColorStop(1,'#02040d');g.fillStyle=gr;g.fillRect(0,0,W,H);g.lineWidth=1;
for(i=0;i<N.length;i++){a=N[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;dx=PX-a.x;dy=PY-a.y;d=Math.sqrt(dx*dx+dy*dy);if(d<D*2&&d>1){a.x+=dx/d*.4;a.y+=dy/d*.4}h=(i%6==0?350:195+i*3%35);
for(j=i+1;j<N.length;j++){b=N[j];dx=a.x-b.x;dy=a.y-b.y;d=Math.sqrt(dx*dx+dy*dy);if(d<D){g.strokeStyle='hsla('+h+',100%,70%,'+((1-d/D)*.55).toFixed(2)+')';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}
g.fillStyle='hsl('+h+',100%,75%)';g.beginPath();g.arc(a.x,a.y,Math.max(1.5,W/700),0,6.3);g.fill()}}
function warp(){var cx=W/2+mx*W*.08,cy=H/2+my*H*.08,f=Math.max(W,H)*.14,i,s,zz,gl=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.35);g.globalCompositeOperation='source-over';g.fillStyle='rgba(2,4,13,.35)';g.fillRect(0,0,W,H);gl.addColorStop(0,'rgba(0,200,255,.12)');gl.addColorStop(1,'rgba(0,200,255,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);g.lineCap='round';
for(i=0;i<Z.length;i++){s=Z[i];s.z-=.006;if(s.z<=.02){s.x=rnd(-1,1);s.y=rnd(-1,1);s.z=1;continue}zz=Math.min(1,s.z+.04);
g.strokeStyle='hsla('+(s.x>.72?350:200+s.x*20+s.y*15)+',100%,'+(60+20*(1-s.z))+'%,'+(1-s.z)+')';g.lineWidth=(1-s.z)*3*(W/1000+.5);g.beginPath();g.moveTo(cx+s.x/zz*f,cy+s.y/zz*f);g.lineTo(cx+s.x/s.z*f,cy+s.y/s.z*f);g.stroke()}}
var D={rain:rain,net:net,warp:warp};
function draw(){mx+=(tx-mx)*.05;my+=(ty-my)*.05;D[mode]()}
function still(){for(var q=mode=='rain'?400:1;q--;)draw()}
function frame(ts){t=ts;draw();raf=requestAnimationFrame(frame)}
function go(i){idx=i;mode=R[i];try{localStorage.setItem(K,i)}catch(e){}g.globalCompositeOperation='source-over';g.fillStyle='#02040d';g.fillRect(0,0,W,H);RC=[]}
function nxt(){cv.style.opacity=0;setTimeout(function(){go((idx+1)%R.length);cv.style.opacity=1},900)}
addEventListener('pointermove',function(e){tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1;PX=e.clientX*W/innerWidth;PY=e.clientY*H/innerHeight});
addEventListener('resize',size);
document.addEventListener('visibilitychange',function(){cancelAnimationFrame(raf);if(!document.hidden&&!rm)raf=requestAnimationFrame(frame)});
var v=0;try{v=parseInt(localStorage.getItem(K),10)}catch(e){}
size();go(isNaN(v)?0:(v+1)%R.length);
if(rm)still();else{raf=requestAnimationFrame(frame);setInterval(nxt,24000)}
})();
</script>
</body>
