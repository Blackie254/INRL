<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BLACK MD BOT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-image: url("https://files.catbox.moe/vblemg.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      animation: changeBackground 15s infinite;
    }
    @keyframes changeBackground {
      10%, 100% { background-image: url('https://files.catbox.moe/li9riq.jpg'); }
      25%        { background-image: url('https://files.catbox.moe/84bdiz.jpg'); }
      50%        { background-image: url('https://files.catbox.moe/zwmfbf.jpg'); }
      75%        { background-image: url('https://files.catbox.moe/af1sso.jpg'); }
    }
    .btn {
      width: 200px;
      padding: 0.8em 1.75em;
      background-color: blue;
      border-radius: 6px;
      border: .3px solid red;
      transition: .5s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      z-index: 1;
      font-weight: 300;
      font-size: 17px;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      text-transform: uppercase;
      color: red;
      margin-bottom: 24px;
    }
    .btn::after, .btn::before {
      content: '';
      display: block;
      height: 100%;
      width: 100%;
      transform: skew(90deg) translate(-50%, -50%);
      position: absolute;
      inset: 50%;
      left: 25%;
      z-index: -1;
      transition: .5s ease-out;
      background-color: brown;
    }
    .btn::before {
      top: -50%;
      left: -25%;
      transform: skew(90deg) rotate(180deg) translate(-50%, -50%);
    }
    .btn:hover::before { transform: skew(45deg) rotate(180deg) translate(-50%, -50%); }
    .btn:hover::after  { transform: skew(45deg) translate(-50%, -50%); }
    .btn:hover { color: #0E0E0E; }
    .btn:active { filter: brightness(.7); transform: scale(.98); }
  </style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style id="fx-style">
:root{--c1:#00c8ff;--c2:#2f6bff;--c3:#ff1e4d;--c3d:#b8002b;--c4:#4d8dff;--ink:#e6f5ff;--mut:#7f9fc4;--bg:#02040d;--disp:'Orbitron','Segoe UI',system-ui,sans-serif;--body:'Rajdhani','Segoe UI',system-ui,sans-serif;--mono:'Share Tech Mono',ui-monospace,Consolas,monospace}
@property --fa{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes fxspin{to{--fa:360deg}}
@keyframes fxscan{from{top:-4%}to{top:104%}}
@keyframes fxblink{50%{opacity:0}}
@keyframes fxfloat{50%{translate:0 -7px}}
@keyframes fxin{from{opacity:0;scale:.93;filter:blur(6px)}}
@keyframes fxpulse{50%{box-shadow:0 0 22px rgba(0,200,255,.28),0 0 44px rgba(255,30,77,.16),inset 0 0 20px rgba(0,200,255,.08)}}
::selection{background:var(--c4);color:#fff}
html{scrollbar-color:var(--c1) var(--bg)}
body{font-family:var(--body);font-weight:500;color:var(--ink);animation:none!important;background:#000!important}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block;pointer-events:none;transition:opacity .9s ease}
#fx-veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.5) 100%)}
/* containers: holo panels */
.box{position:relative;overflow:hidden;isolation:isolate;border:2px solid transparent;border-radius:6px!important;
background-color:transparent!important;
background-image:linear-gradient(rgba(0,200,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.05) 1px,transparent 1px),linear-gradient(160deg,rgba(4,14,34,.9),rgba(3,6,18,.82)),conic-gradient(from var(--fa),rgba(0,200,255,.26) 0 42%,var(--c1) 58%,var(--c4) 74%,var(--c3) 82%,var(--c4) 88%,var(--c1) 95%,rgba(0,200,255,.26))!important;
background-size:22px 22px,22px 22px,auto,auto!important;background-origin:padding-box,padding-box,padding-box,border-box!important;background-clip:padding-box,padding-box,padding-box,border-box!important;
-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 50px rgba(0,200,255,.22),0 0 90px rgba(47,107,255,.22),0 30px 80px rgba(0,0,0,.65),inset 0 0 60px rgba(47,107,255,.07);
animation:fxin 1s ease both,fxfloat 8s ease-in-out 1s infinite,fxspin 7s linear infinite}
.box::before{content:"";position:absolute;inset:8px;pointer-events:none;background:linear-gradient(var(--c1),var(--c1)) 0 0/18px 2px,linear-gradient(var(--c1),var(--c1)) 0 0/2px 18px,linear-gradient(var(--c3),var(--c3)) 100% 0/18px 2px,linear-gradient(var(--c3),var(--c3)) 100% 0/2px 18px,linear-gradient(var(--c4),var(--c4)) 0 100%/18px 2px,linear-gradient(var(--c4),var(--c4)) 0 100%/2px 18px,linear-gradient(var(--c1),var(--c1)) 100% 100%/18px 2px,linear-gradient(var(--c1),var(--c1)) 100% 100%/2px 18px;background-repeat:no-repeat;filter:drop-shadow(0 0 5px var(--c1))}
.box::after{content:"";position:absolute;left:0;right:0;top:-4%;height:2px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,200,255,.8),rgba(77,141,255,.7),transparent);box-shadow:0 0 16px rgba(0,200,255,.7);animation:fxscan 5s linear infinite}
#text,.box p,.status{color:var(--ink)!important}
.box p{font-size:15px}
.box h3{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--c1)!important;text-shadow:0 0 14px rgba(0,200,255,.8),0 0 30px rgba(47,107,255,.5);padding-bottom:12px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--c1),var(--c4) 70%,var(--c3)) 1}
.box h3::before{content:"> ";color:var(--c3);text-shadow:0 0 12px rgba(255,30,77,.9)}
.box h3::after{content:"_";color:var(--c1);animation:fxblink 1s steps(1) infinite}
.box h4{font-family:var(--body);color:var(--mut)!important;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.fa-user{font-size:30px;color:var(--c1);filter:drop-shadow(0 0 8px var(--c1))}
.status{font-family:var(--mono);font-size:13px!important;letter-spacing:.04em}
.qr-wrap{color:#02040d;border-radius:3px!important;outline:1px solid rgba(77,141,255,.85);outline-offset:6px;box-shadow:0 0 0 1px var(--c1),0 0 34px rgba(0,200,255,.6),0 0 60px rgba(77,141,255,.4)}
.box .btn{font-family:var(--disp);font-weight:700;font-size:12px;background:transparent!important;color:var(--c1)!important;border:1px solid var(--c1)!important;border-bottom:2px solid var(--c4)!important;border-radius:3px!important;text-transform:uppercase;letter-spacing:.16em;transition:.25s}
.box .btn:hover{background:var(--c1)!important;color:var(--bg)!important;border-bottom-color:var(--c4)!important;box-shadow:0 0 26px rgba(0,200,255,.7),0 6px 22px rgba(77,141,255,.5)}
/* pair form */
.input-container{background:rgba(0,200,255,.07)!important;border:1px solid rgba(0,200,255,.38);border-radius:4px!important;box-shadow:none}
.input-container input{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:rgba(1,5,16,.9)!important;color:var(--c1)!important;border-left:3px solid var(--c1)!important;border-radius:3px!important}
.input-container input::placeholder{color:#4a6a92}
.input-container input:focus{box-shadow:0 0 0 1px var(--c1),0 0 22px rgba(0,200,255,.55)}
.input-container button{font-family:var(--disp);font-weight:900;font-size:11px;letter-spacing:.12rem;padding:1rem .4rem;background:linear-gradient(135deg,var(--c1),var(--c4))!important;color:var(--bg)!important;border-radius:3px!important;box-shadow:0 0 16px rgba(0,200,255,.5);cursor:pointer}
.input-container button:hover{background:linear-gradient(135deg,var(--c3),var(--c3d))!important;color:#fff!important;box-shadow:0 0 22px rgba(255,30,77,.55)}
.music-button{font-family:var(--disp);font-weight:700;font-size:12px!important;letter-spacing:.14em;text-transform:uppercase;background:transparent!important;border:1px solid var(--c1)!important;color:var(--c1)!important;border-radius:3px!important;transition:.25s}
.music-button:hover{background:rgba(0,200,255,.16)!important;box-shadow:0 0 22px rgba(0,200,255,.6)}
.countdown{font-family:var(--mono);color:var(--mut)!important}.countdown.urgent{color:var(--c3)!important;text-shadow:0 0 10px rgba(255,30,77,.7);animation:fxblink 1s steps(1) infinite}
#waiting-message{color:var(--mut);font-family:var(--mono)}
#pair [style*="black"]{color:var(--ink)!important}
#pair a[style*="red"]{color:var(--c3)!important}
#pair #copy[style*="red"]{color:var(--c4)!important;text-shadow:0 0 12px rgba(77,141,255,.6)}
#pair [style*="blue"]{color:var(--c1)!important}
#pair [style*="#555"],#pair [style*="#000"]{color:var(--mut)!important}
#pair a,#pair small{font-family:var(--body);letter-spacing:.04em}
#pair #copy span[style]{font-family:var(--mono);font-size:26px;letter-spacing:.3em;color:var(--c1)!important;text-shadow:0 0 16px var(--c1),0 0 34px rgba(47,107,255,.6)}
/* home buttons */
body>.btn{width:290px!important;font-family:var(--disp)!important;font-weight:700!important;font-size:13px!important;text-transform:uppercase;letter-spacing:.16em;background:rgba(3,10,26,.74)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(0,200,255,.5)!important;border-left:4px solid var(--c4)!important;border-radius:3px!important;color:var(--c3)!important;text-shadow:0 0 10px rgba(255,30,77,.65);box-shadow:0 0 20px rgba(0,200,255,.18),inset 0 0 20px rgba(0,200,255,.07);animation:fxin .9s ease both,fxfloat 7s ease-in-out 1s infinite}
body>.btn:nth-of-type(2){animation-delay:.15s,-2s}body>.btn:nth-of-type(3){animation-delay:.3s,-4s}
body>.btn::before{background:var(--c4)!important}
body>.btn::after{background:var(--c1)!important}
body>.btn:hover{color:var(--bg)!important;text-shadow:none;box-shadow:0 0 34px rgba(0,200,255,.6),0 0 60px rgba(77,141,255,.45)}
.home-tag{margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);text-align:center}
.home-tag i{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--c3);box-shadow:0 0 10px var(--c3);animation:fxblink 1.4s steps(1) infinite;vertical-align:middle}
button:focus-visible,input:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.box,.box::after,.box h3::after,.countdown.urgent,body>.btn,.home-tag i{animation:none!important}}
.bm-logo{display:block;width:112px;height:auto;margin:0 auto 8px;filter:drop-shadow(0 0 12px rgba(0,200,255,.6)) drop-shadow(0 0 22px rgba(77,141,255,.4))}
/* responsive: fluid sizing so the panel never fills the screen */
html{-webkit-text-size-adjust:100%}
body{box-sizing:border-box;height:auto!important;min-height:100vh;min-height:100dvh;overflow-x:hidden!important;overflow-y:auto!important;padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.box{box-sizing:border-box;width:min(88vw,380px)!important;max-width:none!important;padding:clamp(16px,5vw,26px)!important}
.box h3{font-size:clamp(13px,4.8vw,19px);letter-spacing:clamp(.1em,1.8vw,.22em)}
.box h4{font-size:clamp(10px,3.2vw,13px);letter-spacing:clamp(.08em,1.2vw,.2em)}
.box p{font-size:clamp(12px,3.6vw,15px)}
.bm-logo{width:clamp(84px,26vw,112px)}
.qr-wrap img{width:min(220px,56vw)!important;height:auto!important;aspect-ratio:1/1}
.input-container{max-width:100%!important;margin-inline:auto}
#pair #copy span[style]{font-size:clamp(17px,6.2vw,26px);letter-spacing:clamp(.1em,1.6vw,.3em)}
.music-button{font-size:clamp(11px,3.2vw,12px)!important}
body>.btn{width:min(82vw,300px)!important;font-size:clamp(11px,3.4vw,13px)!important;letter-spacing:clamp(.08em,1.6vw,.16em);padding:.9em 1em!important;margin-bottom:clamp(14px,3vh,24px)}
.home-tag{font-size:clamp(10px,3vw,12px);letter-spacing:clamp(.1em,1.4vw,.2em)}
@media(max-width:340px){.box::before{inset:5px}.box .btn{letter-spacing:.08em}}
@media(max-height:560px){.bm-logo{width:68px;margin-bottom:2px}.box{padding:14px!important}.box h3{padding-bottom:8px}.box h4{margin:6px 0}}
